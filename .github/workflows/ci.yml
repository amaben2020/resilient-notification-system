# Fast feedback for feature branches (dev, feature/*): tests + terraform sanity.
# No AWS credentials, no state, nothing deployed. Promotion to an environment
# happens via PR into staging (plan) and merge (apply) - see deploy-staging.yml.
name: CI

on:
  push:
    branches-ignore: [staging, main, master]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:workers

      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt / validate (no backend, no AWS)
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
