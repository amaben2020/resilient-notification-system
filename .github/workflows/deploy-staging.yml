# Pull request into staging -> plan only (review the diff in the Actions log).
# Push / merge into staging      -> plan + apply.
name: Deploy to Staging

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]

jobs:
  staging:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: staging
      apply: ${{ github.event_name == 'push' }}
    secrets: inherit
