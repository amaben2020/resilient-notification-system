# Reusable workflow: build workers -> migrate DB -> terraform plan -> (apply).
# Called by deploy-staging.yml and deploy-prod.yml with a different `environment`.
name: Terraform

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string # staging | prod
      apply:
        required: true
        type: boolean # false on pull requests (plan only), true on push
    # Secrets come via `secrets: inherit` from the caller, so both repo-level
    # and environment-level (staging/prod) secrets resolve here.

jobs:
  terraform:
    runs-on: ubuntu-latest
    # GitHub environment that holds the secrets (Settings -> Environments).
    # Distinct from inputs.environment, which selects the Terraform tfvars/state.
    environment: notif-app
    # never let two runs touch the same state at once
    concurrency: terraform-${{ inputs.environment }}
    defaults:
      run:
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      ENV_NAME: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install, test, bundle Lambda workers
        working-directory: .
        run: |
          npm ci
          npm test
          npm run build:workers

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init \
            -backend-config=environments/backend.hcl \
            -backend-config="key=${{ inputs.environment }}/terraform.tfstate"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -var-file=environments/${{ inputs.environment }}.tfvars -out=tfplan

      - name: Terraform apply
        if: inputs.apply
        run: terraform apply tfplan

      # Terraform created the SSM parameters as PLACEHOLDER. Seed them from GitHub
      # secrets the first time only; after that SSM is the source of truth and
      # rotation happens with `scripts/secrets.sh put` - never overwritten here.
      - name: Seed SSM secrets (first deploy only)
        if: inputs.apply
        working-directory: .
        run: |
          scripts/secrets.sh seed "$ENV_NAME" database-url '${{ secrets.DATABASE_URL }}'
          if [ -n '${{ secrets.GRAFANA_CLOUD_API_KEY }}' ]; then
            scripts/secrets.sh seed "$ENV_NAME" grafana-cloud-api-key '${{ secrets.GRAFANA_CLOUD_API_KEY }}'
          fi
          if [ -n '${{ secrets.NEW_RELIC_LICENSE_KEY }}' ]; then
            scripts/secrets.sh seed "$ENV_NAME" new-relic-license-key '${{ secrets.NEW_RELIC_LICENSE_KEY }}'
          fi

      # Migrations read the SAME value the Lambdas will use.
      - name: Run DB migrations
        if: inputs.apply
        working-directory: .
        run: |
          export DATABASE_URL=$(scripts/secrets.sh get "$ENV_NAME" database-url)
          npm run db:migrate

      # Post-deploy check against the real stack: publish to the topic, assert
      # all three workers processed it (see tests/integration/fanout.test.js).
      - name: Integration test (fan-out through real SNS/SQS/Lambda)
        if: inputs.apply
        working-directory: .
        run: |
          export DATABASE_URL=$(scripts/secrets.sh get "$ENV_NAME" database-url)
          export PAYMENT_CONFIRMED_TOPIC_ARN=$(terraform -chdir=terraform output -raw payment_confirmed_topic_arn)
          npm run test:integration

      # Same flow through the public URL: POST a payment, wait for the workers.
      - name: Smoke test the public API URL
        if: inputs.apply
        working-directory: .
        run: |
          export API_URL=$(terraform -chdir=terraform output -raw api_url)
          npm run smoke
          echo "API: $API_URL" >> "$GITHUB_STEP_SUMMARY"
